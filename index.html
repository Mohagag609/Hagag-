<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدير الاستثمار العقاري — النسخة النهائية (محلي) — محدثة</title>
<style>
:root{
  --bg:#0b1020;--panel:#111731;--card:#0f152b;--line:#1e274a;--ink:#e8ecf3;--muted:#9fb0cc;--brand:#2563eb;
  --ok:#22c55e;--warn:#ef4444;--gold:#d4af37;--accent:#06b6d4;
}
:root[data-theme="light"]{
  --bg:#f8fafc;--panel:#ffffff;--card:#ffffff;--line:#e2e8f0;--ink:#0f172a;--muted:#475569;--brand:#2563eb;
  --ok:#16a34a;--warn:#dc2626;--gold:#b45309;--accent:#0891b2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto}
.container{max-width:1280px;margin:0 auto;padding:16px}
.header{display:flex;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:grid;place-items:center;font-size:20px}
h1{font-size:18px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.tab.active{background:var(--brand);color:#fff;border-color:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.grid{display:grid;gap:10px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.input,.select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn{padding:10px 14px;border:none;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
.btn.secondary{background:#334155;color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.gold{background:var(--gold);color:#111827}
.table{width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden}
.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
.table th{user-select:none;cursor:pointer}
.badge{padding:4px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.badge.ok{background:#052e1b;color:#34d399;border-color:#065f46}
.badge.info{background:#07243f;color:#60a5fa;border-color:#1d4ed8}
.badge.warn{background:#3b0b0b;color:#f87171;border-color:#991b1b}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{margin:0 0 6px 0;color:var(--muted);font-size:13px}
.big{font-size:22px;font-weight:700}
.pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#0b122b;color:#cbd5e1}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.progress{height:10px;border-radius:999px;background:#0f172a;overflow:hidden;border:1px solid var(--line)}
.progress > div{height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b);width:0%}
.overdue td{background:rgba(239,68,68,.08)}
[contenteditable=true]{outline:1px dashed transparent;border-radius:6px}
[contenteditable=true]:focus{outline:1px dashed var(--brand);background:rgba(37,99,235,.08)}
@media print{
  body{background:#fff;color:#000}
  .header,.tabs,.tools,button{display:none !important}
  .panel,.card{border:none}
  .table th,.table td{border:1px solid #ccc}
}
@media(max-width:900px){.grid-2,.grid-3,.grid-4,.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand"><div class="logo">🏛️</div><h1>مدير الاستثمار العقاري — النسخة النهائية</h1></div>
    <div class="tools">
      <select class="select" id="themeSel"><option value="dark">داكن</option><option value="light">فاتح</option></select>
      <select class="select" id="fontSel"><option value="14">خط 14</option><option value="16" selected>خط 16</option><option value="18">خط 18</option></select>
      <button class="btn secondary" id="lockBtn">🔒 قفل</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="view"></div>
  <div style="text-align:center;color:var(--muted);font-size:12px;margin-top:10px">💾 LocalStorage • PDF/CSV • بحث/فرز/تعديل مباشر • أقساط مرنة • عمولة/صيانة • تدفقات نقدية • فلاتر تاريخ للتقارير</div>
</div>

<script>
/* ===== أساس التطبيق / إعدادات / قفل ===== */
const APPKEY='estate_pro_final_v3';
const state = load();
function load(){
  try{
    return JSON.parse(localStorage.getItem(APPKEY))||{
      customers:[],units:[],partners:[],unitPartners:[],contracts:[],installments:[],payments:[],
      settings:{theme:'dark',font:16},locked:false
    };
  }catch{
    return {customers:[],units:[],partners:[],unitPartners:[],contracts:[],installments:[],payments:[],
      settings:{theme:'dark',font:16},locked:false};
  }
}
function persist(){ localStorage.setItem(APPKEY, JSON.stringify(state)); applySettings(); }
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }
function today(){ return new Date().toISOString().slice(0,10); }
const fmt = new Intl.NumberFormat('ar-EG'); function egp(v){ v=Number(v||0); return isFinite(v)?fmt.format(v)+' ج.م':'' }
function applySettings(){ document.documentElement.setAttribute('data-theme', state.settings.theme||'dark'); document.documentElement.style.fontSize=(state.settings.font||16)+'px'; }
applySettings();
document.getElementById('themeSel').value=state.settings.theme||'dark';
document.getElementById('fontSel').value=String(state.settings.font||16);
document.getElementById('themeSel').onchange=(e)=>{ state.settings.theme=e.target.value; persist(); };
document.getElementById('fontSel').onchange=(e)=>{ state.settings.font=Number(e.target.value); persist(); };
document.getElementById('lockBtn').onclick=()=>{
  const pass=prompt('ضع كلمة مرور أو اتركها فارغة لإلغاء القفل','');
  state.locked=!!pass; state.settings.pass=pass||null; persist();
  alert(state.locked?'تم تفعيل القفل':'تم إلغاء القفل'); checkLock();
};
function checkLock(){
  if(state.locked){
    const p=prompt('اكتب كلمة المرور للدخول');
    if(p!==state.settings.pass){
      alert('كلمة مرور غير صحيحة'); location.reload();
    }
  }
}
checkLock();

/* ===== تنقل ===== */
const routes=[
  {id:'dash',title:'لوحة التحكم',render:renderDash},
  {id:'customers',title:'العملاء',render:renderCustomers},
  {id:'units',title:'الوحدات',render:renderUnits},
  {id:'contracts',title:'العقود',render:renderContracts},
  {id:'installments',title:'الأقساط',render:renderInstallments},
  {id:'payments',title:'المدفوعات',render:renderPayments},
  {id:'partners',title:'الشركاء',render:renderPartners},
  {id:'reports',title:'التقارير',render:renderReports},
  {id:'backup',title:'نسخة احتياطية',render:renderBackup},
];
const tabs=document.getElementById('tabs'), view=document.getElementById('view');
routes.forEach(r=>{ const b=document.createElement('button'); b.className='tab'; b.id='tab-'+r.id; b.textContent=r.title; b.onclick=()=>nav(r.id); tabs.appendChild(b); });
function nav(id){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-'+id).classList.add('active'); routes.find(x=>x.id===id).render(); }
nav('dash');

/* ===== أدوات عامة ===== */
function table(headers, rows, sortKey=null, onSort=null){
  const head = headers.map((h,i)=>`<th data-idx="${i}">${h}${sortKey&&sortKey.idx===i?(sortKey.dir==='asc'?' ▲':' ▼'):''}</th>`).join('');
  const body = rows.length? rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${headers.length}"><small>لا توجد بيانات</small></td></tr>`;
  const html = `<table class="table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  const wrap=document.createElement('div'); wrap.innerHTML=html;
  if(onSort){
    wrap.querySelectorAll('th').forEach(th=> th.onclick=()=>{
      const idx=Number(th.dataset.idx); const dir = sortKey && sortKey.idx===idx && sortKey.dir==='asc' ? 'desc' : 'asc';
      onSort({idx,dir});
    });
  }
  return wrap.innerHTML;
}
function exportCSV(headers, rows, name){
  const csv=[headers.join(','), ...rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}), url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}
function parseNumber(v){ v=String(v||'').replace(/[^\d.]/g,''); return Number(v||0); }
function printHTML(title, bodyHTML){
  const w=window.open('','_blank');
  w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${title}</title>
  <style>
    @page{size:A4;margin:12mm}
    body{font-family:system-ui,Segoe UI,Roboto; padding:0; margin:0; direction:rtl; color:#111}
    .wrap{padding:16px 18px}
    h1{font-size:20px;margin:0 0 12px 0}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{border:1px solid #ccc;padding:6px 8px;text-align:right;vertical-align:top}
    thead th{background:#f1f5f9}
    footer{margin-top:12px;font-size:11px;color:#555}
  </style>
  </head><body><div class="wrap">${bodyHTML}
  <footer>تمت الطباعة في ${new Date().toLocaleString('ar-EG')}</footer>
  </div></body></html>`);
  w.document.close(); w.focus(); w.print();
}
function unitById(id){ return state.units.find(u=>u.id===id); }
function custById(id){ return state.customers.find(c=>c.id===id); }
function partnerById(id){ return state.partners.find(p=>p.id===id); }
function unitCode(id){ return (unitById(id)||{}).code||'—'; }

/* ===== لوحة التحكم ===== */
function renderDash(){
  const total=state.units.length, avail=state.units.filter(u=>u.status==='متاحة').length, sold=state.units.filter(u=>u.status==='مباعة').length, ret=state.units.filter(u=>u.status==='مرتجعة').length;
  const revenue=state.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const now=new Date(); const proj={};
  state.installments.filter(i=>i.status!=='مدفوع' && i.dueDate && new Date(i.dueDate)>=now).forEach(i=>{ const ym=i.dueDate.slice(0,7); proj[ym]=(proj[ym]||0)+Number(i.amount||0); });
  const projRows=Object.keys(proj).sort().slice(0,12).map(k=>[k, egp(proj[k])]);
  view.innerHTML=`
    <div class="kpis">
      <div class="card"><h3>إجمالي الوحدات</h3><div class="big">${total}</div></div>
      <div class="card"><h3>المتاحة</h3><div class="big">${avail}</div></div>
      <div class="card"><h3>المباعة</h3><div class="big">${sold}</div></div>
      <div class="card"><h3>المرتجعة</h3><div class="big">${ret}</div></div>
    </div>
    <div class="kpis" style="margin-top:10px">
      <div class="card"><h3>إجمالي المتحصل</h3><div class="big">${egp(revenue)}</div></div>
      <div class="card"><h3>الأقساط القادمة (12 شهر)</h3><div class="big">${egp(Object.values(proj).reduce((a,b)=>a+b,0))}</div></div>
      <div class="card"><h3>اليوم</h3><div class="big">${today()}</div></div>
      <div class="card"><h3>تقارير</h3><div><button class="btn gold" onclick="nav('reports')">اذهب</button></div></div>
    </div>
    <div class="card" style="margin-top:10px">
      <h3>تدفقات نقدية الأقساط القادمة</h3>
      ${table(['الشهر','الإجمالي'], projRows)}
      <div class="tools"><button class="btn" onclick="printProjection()">طباعة PDF</button></div>
    </div>`;
}
window.printProjection=()=>{
  const now=new Date(); const proj={};
  state.installments.filter(i=>i.status!=='مدفوع' && i.dueDate && new Date(i.dueDate)>=now).forEach(i=>{ const ym=i.dueDate.slice(0,7); proj[ym]=(proj[ym]||0)+Number(i.amount||0); });
  const rows=Object.keys(proj).sort().slice(0,12).map(k=>`<tr><td>${k}</td><td>${egp(proj[k])}</td></tr>`).join('');
  printHTML('تدفقات نقدية الأقساط القادمة', `<h1>تدفقات نقدية (12 شهر)</h1><table><thead><tr><th>الشهر</th><th>الإجمالي</th></tr></thead><tbody>${rows}</tbody></table>`);
};

/* ===== العملاء ===== */
function renderCustomers(){
  let sort={idx:0,dir:'asc'};
  function draw(){
    const q=(document.getElementById('c-q')?.value||'').trim();
    let list=state.customers.slice();
    if(q) list=list.filter(c=> JSON.stringify(c).includes(q));
    list.sort((a,b)=>{
      const cols=[a.name||'',a.phone||'']; const colsB=[b.name||'',b.phone||''];
      return (cols[sort.idx]+'' ).localeCompare(colsB[sort.idx]+'')*(sort.dir==='asc'?1:-1);
    });
    const rows=list.map(c=>[
      `<span contenteditable="true" onblur="inlineUpd('customers','${c.id}','name',this.textContent)">${c.name||''}</span>`,
      `<span contenteditable="true" onblur="inlineUpd('customers','${c.id}','phone',this.textContent)">${c.phone||''}</span>`,
      `<button class="btn secondary" onclick="delRow('customers','${c.id}')">حذف</button>`
    ]);
    document.getElementById('c-list').innerHTML=table(['الاسم','الهاتف',''], rows, sort, ns=>{sort=ns;draw();});
  }
  view.innerHTML=`
  <div class="grid grid-2">
    <div class="card">
      <h3>إضافة عميل</h3>
      <input class="input" id="c-name" placeholder="اسم العميل">
      <input class="input" id="c-phone" placeholder="الهاتف">
      <button class="btn" onclick="addCustomer()">حفظ</button>
    </div>
    <div class="card">
      <h3>العملاء</h3>
      <div class="tools">
        <input class="input" id="c-q" placeholder="بحث" oninput="draw()">
        <button class="btn secondary" onclick="expCustomers()">CSV</button>
        <label class="btn secondary"><input type="file" id="c-imp" accept=".csv" style="display:none">استيراد CSV</label>
        <button class="btn" onclick="printCustomers()">طباعة PDF</button>
      </div>
      <div id="c-list"></div>
    </div>
  </div>`;
  window.addCustomer=()=>{
    const name=document.getElementById('c-name').value.trim(); if(!name) return alert('اكتب اسم');
    state.customers.push({id:uid('C'),name,phone:document.getElementById('c-phone').value||''}); persist(); draw();
  };
  window.expCustomers=()=>{
    exportCSV(['الاسم','الهاتف'], state.customers.map(c=>[c.name||'',c.phone||'']), 'customers.csv');
  };
  document.getElementById('c-imp').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ const lines=String(r.result).split(/\r?\n/).slice(1); lines.forEach(line=>{ const [name,phone]=line.split(',').map(x=>x?.replace(/^"|"$/g,'')||''); if(name) state.customers.push({id:uid('C'),name,phone}); }); persist(); draw(); };
    r.readAsText(f,'utf-8');
  };
  window.printCustomers=()=>{
    const rows=state.customers.map(c=>`<tr><td>${c.name||''}</td><td>${c.phone||''}</td></tr>`).join('');
    printHTML('تقرير العملاء', `<h1>تقرير العملاء</h1><table><thead><tr><th>الاسم</th><th>الهاتف</th></tr></thead><tbody>${rows}</tbody></table>`);
  };
  draw();
}
window.inlineUpd=(coll,id,key,val)=>{ const o=state[coll].find(x=>x.id===id); if(o){ o[key]=val; persist(); } };
window.delRow=(coll,id)=>{ state[coll]=state[coll].filter(x=>x.id!==id); persist(); nav(''+coll); };

/* ===== الوحدات ===== */
function calcRemaining(u){
  const ct=state.contracts.find(c=>c.unitId===u.id);
  const broker=ct?Number(ct.brokerAmount||0):0, maint=ct?Number(ct.maintenanceDeposit||0):0;
  const base=ct? (Number(ct.totalPrice||u.totalPrice||0) - Number(ct.downPayment||0) - broker - maint) : Number(u.totalPrice||0);
  const paid=state.payments.filter(p=>p.unitId===u.id).reduce((s,p)=>s+Number(p.amount||0),0);
  return Math.max(0, base - paid);
}
function renderUnits(){
  let sort={idx:0,dir:'asc'};
  function draw(){
    const q=(document.getElementById('u-q')?.value||'').trim();
    let list=state.units.slice();
    if(q) list=list.filter(u=> JSON.stringify(u).includes(q));
    list.sort((a,b)=>{
      const cols=[a.code||'', a.name||'', String(a.totalPrice||0), a.floor||'', a.building||'', a.status||''];
      const colsB=[b.code||'', b.name||'', String(b.totalPrice||0), b.floor||'', b.building||'', b.status||''];
      return (cols[sort.idx]+'').localeCompare(colsB[sort.idx]+'')*(sort.dir==='asc'?1:-1);
    });
    const rows=list.map(u=>[
      `<span contenteditable="true" onblur="inlineUpd('units','${u.id}','code',this.textContent)">${u.code||''}</span>`,
      `<span contenteditable="true" onblur="inlineUpd('units','${u.id}','name',this.textContent)">${u.name||''}</span>`,
      `<span contenteditable="true" onblur="numEdit('units','${u.id}','totalPrice',this)">${u.totalPrice||0}</span>`,
      `<span contenteditable="true" onblur="inlineUpd('units','${u.id}','floor',this.textContent)">${u.floor||''}</span>`,
      `<span contenteditable="true" onblur="inlineUpd('units','${u.id}','building',this.textContent)">${u.building||''}</span>`,
      `<span>${egp(calcRemaining(u))}</span>`,
      `<span contenteditable="true" onblur="inlineUpd('units','${u.id}','status',this.textContent)">${u.status||'متاحة'}</span>`,
      `<button class="btn" onclick="openUnit('${u.id}')">تفاصيل</button>`,
      `<button class="btn secondary" onclick="delRow('units','${u.id}')">حذف</button>`
    ]);
    document.getElementById('u-list').innerHTML=
      table(['الكود','اسم الوحدة','السعر','الدور','العمارة','المتبقي','الحالة','',''], rows, sort, ns=>{sort=ns;draw();});
  }

  view.innerHTML=`
  <div class="grid">
    <div class="card">
      <h3>إضافة وحدة</h3>
      <div class="grid grid-4">
        <input class="input" id="u-code" placeholder="كود/اسم مختصر">
        <input class="input" id="u-name" placeholder="اسم الوحدة">
        <input class="input" id="u-total" placeholder="السعر الكلي" oninput="this.value=this.value.replace(/[^\\d.]/g,'')">
        <select class="select" id="u-status"><option>متاحة</option><option>مباعة</option><option>مرتجعة</option></select>
        <input class="input" id="u-floor" placeholder="رقم الدور">
        <input class="input" id="u-building" placeholder="رقم العمارة">
      </div>
      <button class="btn" onclick="addUnit()">حفظ</button>
    </div>
    <div class="card">
      <h3>قائمة الوحدات</h3>
      <div class="tools">
        <input class="input" id="u-q" placeholder="بحث" oninput="draw()">
        <button class="btn secondary" onclick="expUnits()">CSV</button>
        <label class="btn secondary"><input type="file" id="u-imp" style="display:none" accept=".csv">استيراد CSV</label>
        <button class="btn" onclick="printUnits()">طباعة PDF</button>
      </div>
      <div id="u-list"></div>
    </div>
  </div>`;

  window.addUnit=()=>{
    const code=document.getElementById('u-code').value.trim();
    const name=document.getElementById('u-name').value.trim();
    const total=parseNumber(document.getElementById('u-total').value);
    const status=document.getElementById('u-status').value;
    const floor=document.getElementById('u-floor').value.trim();
    const building=document.getElementById('u-building').value.trim();
    if(!code||!total) return alert('أدخل الكود والسعر');
    state.units.push({id:uid('U'),code,name,totalPrice:total,status,floor,building});
    persist(); draw();
  };

  window.expUnits=()=>{
    const headers=['الكود','اسم الوحدة','السعر','الدور','العمارة','الحالة','المتبقي'];
    const rows=state.units.map(u=>[u.code,u.name||'',u.totalPrice,u.floor||'',u.building||'',u.status,calcRemaining(u)]);
    exportCSV(headers, rows, 'units.csv');
  };

  document.getElementById('u-imp').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      const lines=String(r.result).split(/\r?\n/).slice(1);
      lines.forEach(line=>{
        const [code,name,total,status,floor,building]=line.split(',').map(x=>x?.replace(/^"|"$/g,'')||'');
        if(code) state.units.push({id:uid('U'),code,name,totalPrice:parseNumber(total),status:status||'متاحة',floor,building});
      });
      persist(); draw();
    };
    r.readAsText(f,'utf-8');
  };

  window.printUnits=()=>{
    const rows=state.units.map(u=>`<tr><td>${u.code}</td><td>${u.name||''}</td><td>${egp(u.totalPrice)}</td><td>${u.floor||''}</td><td>${u.building||''}</td><td>${u.status}</td><td>${egp(calcRemaining(u))}</td></tr>`).join('');

/* ===== العقود + توليد أقساط + اختيار الشركاء داخلي ===== */
function renderContracts(){
  // مصفوفة مؤقتة للشركاء المختارين قبل حفظ العقد
  const temp = { partners: [] }; // {partnerId, name, percent}
  function drawPartnersBox(){
    const rows = temp.partners.map((p,idx)=>[
      p.name,
      p.percent + ' %',
      `<button class="btn secondary" onclick="__delPr(${idx})">حذف</button>`
    ]);
    document.getElementById('ct-partners-box').innerHTML = table(['الشريك','النسبة',''], rows);
    const sum = temp.partners.reduce((s,p)=>s+Number(p.percent||0),0);
    document.getElementById('ct-partners-sum').textContent = sum + ' %';
    document.getElementById('ct-partners-sum').className = 'badge ' + (sum > 100 ? 'warn' : (sum === 100 ? 'ok' : 'info'));
  }
  window.__addPrFromUI=()=>{
      const partnerId = document.getElementById('pr-select').value;
      if(!partnerId) return alert('الرجاء اختيار شريك');

      if(temp.partners.find(p => p.partnerId === partnerId)){
          return alert('هذا الشريك تم إضافته بالفعل.');
      }

      const perc = Number(document.getElementById('pr-percent').value);
      if(!(perc > 0 && perc <= 100)) return alert('الرجاء إدخال نسبة صحيحة (بين 1 و 100)');

      const pr = partnerById(partnerId);
      if(!pr) return alert('لم يتم العثور على الشريك');

      temp.partners.push({partnerId:pr.id,name:pr.name,percent:perc});
      document.getElementById('pr-select').value = '';
      document.getElementById('pr-percent').value = '';
      drawPartnersBox();
  };
  window.__delPr=(idx)=>{ temp.partners.splice(idx,1); drawPartnersBox(); };

  function draw(){
    const rows=state.contracts.map(c=>[ unitCode(c.unitId), (custById(c.customerId)||{}).name||'—', egp(c.totalPrice), egp(c.downPayment), egp(c.maintenanceDeposit||0), egp(c.brokerAmount||0)+' ('+(c.brokerPercent||0)+'%)', c.type, c.count, c.start ]);
    document.getElementById('ct-list').innerHTML=table(['الوحدة','العميل','السعر','المقدم','الصيانة','العمولة','النوع','عدد الدفعات','بداية'], rows);
  }
  view.innerHTML=`
  <div class="grid">
    <div class="card">
      <h3>إضافة عقد</h3>
      <div class="grid grid-4">
        <select class="select" id="ct-unit"><option value="">الوحدة</option>${state.units.filter(u=>u.status!=='مباعة').map(u=>`<option value="${u.id}">${u.code}</option>`).join('')}</select>
        <select class="select" id="ct-cust"><option value="">العميل</option>${state.customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
        <input class="input" id="ct-total" placeholder="السعر الكلي" oninput="this.value=this.value.replace(/[^\\d.]/g,'')">
        <input class="input" id="ct-down" placeholder="المقدم" oninput="this.value=this.value.replace(/[^\\d.]/g,'')">
        <input class="input" id="ct-maint" placeholder="وديعة الصيانة (خارج الأقساط)" oninput="this.value=this.value.replace(/[^\\d.]/g,'')">
        <input class="input" id="ct-brokerp" placeholder="نسبة السمسار %" oninput="this.value=this.value.replace(/[^\\d.]/g,'')">
        <select class="select" id="ct-type"><option>شهري</option><option>ربع سنوي</option><option>نصف سنوي</option><option>سنوي</option></select>
        <input class="input" id="ct-count" placeholder="عدد الدفعات" oninput="this.value=this.value.replace(/[^\\d]/g,'')">
        <input class="input" id="ct-annual-bonus" placeholder="دفعات سنوية إضافية (0-3)" oninput="this.value=this.value.replace(/[^\\d]/g,'')">
        <input class="input" id="ct-start" type="date" value="${today()}">
      </div>
      <div style="color:var(--muted); font-size:12px; margin-top:4px; padding-right: 5px;">
        إجمالي عدد الأقساط: <span id="ct-total-installments" style="font-weight:bold;">0</span>
      </div>
      <div class="card" style="margin-top:8px">
        <h3>الشركاء في هذا العقد</h3>
        <div class="tools" style="display:flex; flex-wrap:wrap; gap:8px;">
          <select class="select" id="pr-select" style="flex:1;"><option value="">اختر شريك...</option>${state.partners.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
          <input class="input" id="pr-percent" type="number" min="0.1" max="100" step="0.1" placeholder="النسبة %" style="flex:0.5;">
          <button class="btn" onclick="__addPrFromUI()">إضافة</button>
          <span class="badge" id="ct-partners-sum">0 %</span>
        </div>
        <div id="ct-partners-box"></div>
        <small style="color:var(--muted)">أضف شركاء للوحدة من هنا. سيتم حفظهم عند إنشاء العقد. مجموع النسب يجب أن يكون 100%.</small>
      </div>
      <div class="tools">
        <button class="btn" onclick="createContract()">حفظ + توليد أقساط</button>
        <button class="btn secondary" onclick="printContracts()">طباعة PDF</button>
      </div>
    </div>
    <div class="card">
      <h3>العقود</h3>
      <div id="ct-list"></div>
    </div>
  </div>`;

  window.createContract=()=>{
    const unitId=document.getElementById('ct-unit').value, customerId=document.getElementById('ct-cust').value;
    if(!unitId||!customerId) return alert('اختر الوحدة والعميل');
    const total=parseNumber(document.getElementById('ct-total').value), down=parseNumber(document.getElementById('ct-down').value);
    const maint=parseNumber(document.getElementById('ct-maint').value), brokerP=parseNumber(document.getElementById('ct-brokerp').value);
    const type=document.getElementById('ct-type').value, count=parseInt(document.getElementById('ct-count').value||'0',10);
    const extra=parseInt(document.getElementById('ct-annual-bonus').value||'0',10);
    const startStr=document.getElementById('ct-start').value||today(); const start=new Date(startStr);
    if(count<=0) return alert('عدد الدفعات غير صالح');
    const brokerAmt=Math.round((total*brokerP/100)*100)/100;
    const code='CTR-'+String(state.contracts.length+1).padStart(5,'0');
    const ct={id:uid('CT'), code, unitId, customerId, totalPrice:total, downPayment:down, maintenanceDeposit:maint, brokerPercent:brokerP, brokerAmount:brokerAmt, type, count, extraAnnual:Math.min(Math.max(extra,0),3), start:startStr};
    state.contracts.push(ct);

    // توليد الأقساط
    const months={'شهري':1,'ربع سنوي':3,'نصف سنوي':6,'سنوي':12}[type]||1;
    const remain=Math.max(0,total-down-maint-brokerAmt);
    const parts=count + ct.extraAnnual;
    const base=Math.floor((remain/parts)*100)/100; let acc=0;
    for(let i=0;i<count;i++){
      const d=new Date(start); d.setMonth(d.getMonth()+months*(i+1));
      const amt=(i===count-1 && ct.extraAnnual===0)? Math.round((remain-acc)*100)/100 : base; acc+=amt;
      state.installments.push({id:uid('I'),unitId,type,amount:amt,originalAmount:amt,dueDate:d.toISOString().slice(0,10),paymentDate:null,status:'غير مدفوع'});
    }
    for(let j=0;j<ct.extraAnnual;j++){
      const d=new Date(start); d.setMonth(d.getMonth()+12*(j+1));
      const amt=(j===ct.extraAnnual-1)? Math.round((remain-acc)*100)/100 : base; acc+=amt;
      state.installments.push({id:uid('I'),unitId,type:'سَنوي إضافي',amount:amt,originalAmount:amt,dueDate:d.toISOString().slice(0,10),paymentDate:null,status:'غير مدفوع'});
    }

    // ربط الشركاء بالوحدة من داخل العقد
    // First, remove any existing partners for this unit to avoid duplicates if re-assigning
    state.unitPartners = state.unitPartners.filter(up => up.unitId !== unitId);
    temp.partners.forEach(p=>{
      state.unitPartners.push({id:uid('UP'),unitId,partnerId:p.partnerId,percent:Number(p.percent)||0});
    });
    const sum=temp.partners.reduce((s,p)=>s+Number(p.percent||0),0);
    if(sum>0 && sum!==100) alert('تنبيه: مجموع نسب الشركاء لا يساوي 100%');

    const u=unitById(unitId); if(u) u.status='مباعة';
    persist();
    draw();
    printContract(ct);

    // Clear temp partners for the next contract
    temp.partners.length = 0;
    drawPartnersBox();
  };
  window.printContracts=()=>{
    const rows=state.contracts.map(c=>`<tr><td>${c.code||''}</td><td>${unitCode(c.unitId)}</td><td>${(custById(c.customerId)||{}).name||'—'}</td><td>${egp(c.totalPrice)}</td><td>${egp(c.downPayment)}</td><td>${egp(c.maintenanceDeposit||0)}</td><td>${egp(c.brokerAmount||0)} (${c.brokerPercent||0}%)</td><td>${c.type}</td><td>${c.count}</td><td>${c.start}</td></tr>`).join('');
    printHTML('تقرير العقود', `<h1>تقرير العقود</h1><table><thead><tr><th>الكود</th><th>الوحدة</th><th>العميل</th><th>السعر</th><th>المقدم</th><th>صيانة</th><th>عمولة</th><th>نوع</th><th>عدد</th><th>بداية</th></tr></thead><tbody>${rows}</tbody></table>`);
  };
  window.printContract=(ct)=>{
    const html=`<h1>عقد بيع — ${ct.code}</h1>
      <p>الوحدة: ${unitCode(ct.unitId)} — العميل: ${(custById(ct.customerId)||{}).name||'—'}</p>
      <table>
        <tr><th>السعر الكلي</th><td>${egp(ct.totalPrice)}</td></tr>
        <tr><th>المقدم</th><td>${egp(ct.downPayment)}</td></tr>
        <tr><th>وديعة الصيانة</th><td>${egp(ct.maintenanceDeposit||0)}</td></tr>
        <tr><th>عمولة السمسار</th><td>${egp(ct.brokerAmount||0)} (${ct.brokerPercent||0}%)</td></tr>
        <tr><th>نظام الأقساط</th><td>${ct.type} × ${ct.count} + سنوية إضافية: ${ct.extraAnnual}</td></tr>
        <tr><th>بداية العقد</th><td>${ct.start}</td></tr>
      </table>`;
    printHTML('عقد بيع', html);
  };

  function updateTotalInstallments() {
    const countInput = document.getElementById('ct-count');
    const extraInput = document.getElementById('ct-annual-bonus');
    const totalDisplay = document.getElementById('ct-total-installments');
    if (!countInput || !extraInput || !totalDisplay) return;

    const count = parseInt(countInput.value || '0', 10);
    const extra = parseInt(extraInput.value || '0', 10);
    totalDisplay.textContent = count + extra;
  }

  document.getElementById('ct-count').oninput = updateTotalInstallments;
  document.getElementById('ct-annual-bonus').oninput = updateTotalInstallments;

  draw();
  drawPartnersBox();
  updateTotalInstallments();
}

/* ===== الأقساط — إضافة عمود المسدد + منع التكرار في المدفوعات ===== */
function renderInstallments(){
  let sort = { idx: 4, dir: 'asc' };
  view.innerHTML = `
    <div class="card">
      <h3>الأقساط</h3>
      <div class="tools">
        <input class="input" id="i-q" placeholder="بحث بالوحدة/الشهر/الحالة" oninput="__inst_draw()">
        <button class="btn secondary" onclick="expInst()">CSV</button>
        <button class="btn" onclick="printInst()">طباعة PDF</button>
      </div>
      <div id="i-list"></div>
    </div>
  `;
  window.__inst_draw = function draw(){
    const q = (document.getElementById('i-q') && document.getElementById('i-q').value || '').trim();
    let list = state.installments.slice();
    if(q){
      list = list.filter(i =>
        unitCode(i.unitId).includes(q) ||
        (i.status || '').includes(q) ||
        (i.dueDate || '').includes(q)
      );
    }
    list.sort((a,b)=>{
      const A = [
        unitCode(a.unitId),
        a.type || '',
        String((a.originalAmount != null ? a.originalAmount : a.amount) || 0),
        String(a.amount || 0),
        a.dueDate || '',
        a.paymentDate || '',
        a.status || ''
      ];
      const B = [
        unitCode(b.unitId),
        b.type || '',
        String((b.originalAmount != null ? b.originalAmount : b.amount) || 0),
        String(b.amount || 0),
        b.dueDate || '',
        b.paymentDate || '',
        b.status || ''
      ];
      return (A[sort.idx] + '').localeCompare(B[sort.idx] + '') * (sort.dir === 'asc' ? 1 : -1);
    });
    const headers = ['الوحدة','النوع','المبلغ','المتبقي','المسدد','الاستحقاق','السداد','الحالة','دفع','إعادة جدولة','حذف'];
    const headHtml = headers.map((h,i)=>
      `<th data-idx="${i}" style="cursor:pointer;white-space:nowrap">${h}${sort.idx===i?(sort.dir==='asc'?' ▲':' ▼'):''}</th>`
    ).join('');
    const rowsHtml = list.map(i=>{
      const overdue = (i.status!=='مدفوع' && i.dueDate && new Date(i.dueDate) < new Date());
      const original = egp(i.originalAmount != null ? i.originalAmount : i.amount);
      const remaining = egp(i.amount);
      const paidSoFar = state.payments.filter(p => p.installmentId === i.id).reduce((sum, p) => sum + (p.amount || 0), 0);
      const paidAmt = egp(paidSoFar);
      return `<tr class="${overdue ? 'overdue' : ''}">
        <td>${unitCode(i.unitId)}</td>
        <td>${i.type || ''}</td>
        <td>${original}</td>
        <td>${remaining}</td>
        <td>${paidAmt}</td>
        <td><span contenteditable="true" onblur="inlineUpd('installments','${i.id}','dueDate',this.textContent)">${i.dueDate || ''}</span></td>
        <td>${i.paymentDate || '—'}</td>
        <td><span contenteditable="true" onblur="inlineUpd('installments','${i.id}','status',this.textContent)">${i.status || 'غير مدفوع'}</span></td>
        <td><button class="btn ok" onclick="payInstallment('${i.id}', this)">دفع</button></td>
        <td><button class="btn" onclick="reschedule('${i.id}')">إعادة جدولة</button></td>
        <td><button class="btn secondary" onclick="delRow('installments','${i.id}')">حذف</button></td>
      </tr>`;
    }).join('');
    document.getElementById('i-list').innerHTML =
      `<table class="table"><thead><tr>${headHtml}</tr></thead><tbody>${
        rowsHtml || `<tr><td colspan="11"><small>لا توجد بيانات</small></td></tr>`
      }</tbody></table>`;
    document.querySelectorAll('#i-list thead th').forEach(th=>{
      th.onclick = function(){
        const idx = Number(this.getAttribute('data-idx'));
        const dir = (sort.idx === idx && sort.dir === 'asc') ? 'desc' : 'asc';
        sort = { idx, dir };
        __inst_draw();
      };
    });
  };
  window.expInst = function(){
    const headers=['الوحدة','النوع','المبلغ','المتبقي','المسدد','الاستحقاق','السداد','الحالة'];
    const rows=state.installments.map(i=>[
      unitCode(i.unitId),
      i.type,
      (i.originalAmount != null ? i.originalAmount : i.amount),
      i.amount,
      Math.max(0,(i.originalAmount != null ? i.originalAmount : i.amount) - (i.amount||0)),
      i.dueDate||'',
      i.paymentDate||'',
      i.status||''
    ]);
    exportCSV(headers, rows, 'installments.csv');
  };
  window.printInst = function(){
    const rows=state.installments.map(i=>`
      <tr>
        <td>${unitCode(i.unitId)}</td>
        <td>${i.type || ''}</td>
        <td>${egp(i.originalAmount != null ? i.originalAmount : i.amount)}</td>
        <td>${egp(i.amount)}</td>
        <td>${egp(Math.max(0,(i.originalAmount != null ? i.originalAmount : i.amount) - (i.amount||0)))}</td>
        <td>${i.dueDate || ''}</td>
        <td>${i.paymentDate || ''}</td>
        <td>${i.status || ''}</td>
      </tr>`).join('');
    printHTML('تقرير الأقساط',
      `<h1>تقرير الأقساط</h1>
       <table>
         <thead><tr>
           <th>الوحدة</th><th>النوع</th><th>المبلغ</th><th>المتبقي</th><th>المسدد</th><th>الاستحقاق</th><th>السداد</th><th>الحالة</th>
         </tr></thead>
         <tbody>${rows}</tbody>
       </table>`);
  };
  window.payInstallment = function(id, btn){
    if (btn) btn.disabled = true;
    try {
      const i = state.installments.find(x=>x.id===id);
      if(!i) {
          alert('لم يتم العثور على القسط');
          return;
      }
      if(i.status==='مدفوع' || i.amount<=0) {
          alert('هذا القسط مسدد بالكامل');
          return;
      }
      const paid = Number(prompt('المبلغ المدفوع', i.amount) || 0);
      if(!(paid>0)) return; // User cancelled or entered 0

      if (typeof i.originalAmount !== 'number') i.originalAmount = i.amount;
      const payNow = Math.min(paid, i.amount);

      state.payments.push({id:uid('P'),unitId:i.unitId,amount:payNow,method: paid<i.amount?'جزئي':'قسط',date:today(),installmentId:i.id});

      if (paid < i.amount){
        i.amount = Math.round((i.amount - payNow) * 100) / 100;
      } else {
        i.amount = 0;
        i.status = 'مدفوع';
        i.paymentDate = today();
      }
      persist();
      __inst_draw();
    } finally {
        if (btn) setTimeout(() => { btn.disabled = false; }, 200); // Short delay to prevent immediate re-click
    }
  };
  window.reschedule = function(id){
    const i = state.installments.find(x=>x.id===id); if(!i) return;
    const unitId = i.unitId;
    const remainList = state.installments
      .filter(x=>x.unitId===unitId && x.status!=='مدفوع')
      .sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
    const idx = remainList.findIndex(x=>x.id===id);
    const newAmt = Number(prompt('قيمة القسط الجديدة', i.amount) || i.amount);
    const newDate = prompt('تاريخ الاستحقاق الجديد (YYYY-MM-DD)', i.dueDate || '') || i.dueDate;
    const diff = Math.round((i.amount - newAmt) * 100) / 100;
    if (typeof i.originalAmount !== 'number') i.originalAmount = i.amount;
    i.amount = newAmt; i.dueDate = newDate;
    const others = remainList.slice(idx+1);
    const share = others.length ? Math.round((diff / others.length) * 100) / 100 : 0;
    others.forEach(x=>{
      if (typeof x.originalAmount !== 'number') x.originalAmount = x.amount;
      x.amount = Math.round((x.amount + share) * 100) / 100;
    });
    persist(); __inst_draw();
    alert('تمت إعادة الجدولة وتوزيع الفرق على الأقساط التالية.');
  };
  __inst_draw();
}

/* ===== المدفوعات ===== */
function renderPayments(){
  function draw(){
    const q=(document.getElementById('p-q')?.value||'').trim();
    let list=state.payments.slice().reverse();
    if(q) list=list.filter(p=> unitCode(p.unitId).includes(q) || (p.method||'').includes(q) || (p.date||'').includes(q) );
    const rows=list.map(p=>[ unitCode(p.unitId), egp(p.amount), p.method||'—', p.date||'—', (p.installmentId?'<span class="badge info">من قسط</span>':''), `<button class="btn" onclick='printHTML("إيصال دفع", "<h1>إيصال دفع</h1><p>الوحدة: ${unitCode(p.unitId)}</p><p>المبلغ: ${egp(p.amount)}</p><p>الطريقة: ${p.method||"—"}</p><p>التاريخ: ${p.date||"—"}</p>")'>إيصال</button>` ]);
    document.getElementById('p-list').innerHTML=table(['الوحدة','المبلغ','الطريقة','التاريخ','مصدر',''], rows);
  }
  view.innerHTML=`
  <div class="grid grid-2">
    <div class="card">
      <h3>إضافة دفعة</h3>
      <select class="select" id="p-unit"><option value="">الوحدة</option>${state.units.map(u=>`<option value="${u.id}">${u.code}</option>`).join('')}</select>
      <input class="input" id="p-amount" placeholder="المبلغ" oninput="this.value=this.value.replace(/[^\\d.]/g,'')">
      <select class="select" id="p-method"><option>نقدي</option><option>تحويل</option><option>قسط</option><option>جزئي</option></select>
      <input class="input" id="p-date" type="date" value="${today()}">
      <button class="btn" onclick="addPayment()">حفظ + إيصال</button>
    </div>
    <div class="card">
      <h3>المدفوعات</h3>
      <div class="tools">
        <input class="input" id="p-q" placeholder="بحث" oninput="draw()">
        <button class="btn secondary" onclick="expPayments()">CSV</button>
        <button class="btn" onclick="printPayments()">طباعة PDF</button>
      </div>
      <div id="p-list"></div>
    </div>
  </div>`;
  window.addPayment=()=>{
    const unitId=document.getElementById('p-unit').value; const amount=parseNumber(document.getElementById('p-amount').value);
    if(!unitId||!(amount>0)) return alert('اختر وحدة واكتب مبلغ');
    const p={id:uid('P'),unitId,amount,method:document.getElementById('p-method').value,date:document.getElementById('p-date').value||today()};
    state.payments.push(p); persist(); draw();
    printHTML('إيصال دفع', `<h1>إيصال دفع</h1><p>الوحدة: ${unitCode(unitId)}</p><p>المبلغ: ${egp(amount)}</p><p>الطريقة: ${p.method}</p><p>التاريخ: ${p.date}</p>`);
  };
  window.expPayments=()=>{
    exportCSV(['الوحدة','المبلغ','الطريقة','التاريخ','مصدر'], state.payments.map(p=>[unitCode(p.unitId),p.amount,p.method||'',p.date||'', p.installmentId?'قسط':'' ]), 'payments.csv');
  };
  window.printPayments=()=>{
    const rows=state.payments.map(p=>`<tr><td>${unitCode(p.unitId)}</td>
    <td>${egp(p.amount)}</td><td>${p.method||'—'}</td><td>${p.date||'—'}</td></tr>`).join('');
    printHTML('تقرير المدفوعات', `<h1>تقرير المدفوعات</h1><table><thead><tr><th>الوحدة</th><th>المبلغ</th><th>الطريقة</th><th>التاريخ</th></tr></thead><tbody>${rows}</tbody></table>`);
  };
  draw();
}

/* ===== الشركاء + ربطهم بالوحدات ===== */
function renderPartners(){
  view.innerHTML=`
  <div class="grid grid-2">
    <div class="card">
      <h3>إضافة شريك</h3>
      <input class="input" id="pr-name" placeholder="اسم الشريك">
      <input class="input" id="pr-phone" placeholder="الهاتف">
      <button class="btn" onclick="addPartner()">حفظ</button>
      <hr>
      <h3>ربط شريك بوحدة</h3>
      <select class="select" id="up-unit"><option>اختر وحدة</option>${state.units.map(u=>`<option value="${u.id}">${u.code} - ${u.name||''}</option>`).join('')}</select>
      <select class="select" id="up-partner"><option>اختر شريك</option>${state.partners.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
      <input class="input" id="up-percent" placeholder="النسبة %" oninput="this.value=this.value.replace(/[^\\d.]/g,'')">
      <button class="btn" onclick="addUnitPartner()">ربط</button>
    </div>
    <div class="card">
      <h3>الشركاء</h3>
      <div id="pr-list"></div>
      <hr>
      <h3>الوحدات المشتركة</h3>
      <div id="up-list"></div>
    </div>
  </div>`;
  window.addPartner=()=>{
    const name=document.getElementById('pr-name').value.trim(); if(!name) return;
    state.partners.push({id:uid('PR'),name,phone:document.getElementById('pr-phone').value});
    persist(); nav('partners');
  };
  window.addUnitPartner=()=>{
    const unitId=document.getElementById('up-unit').value, partnerId=document.getElementById('up-partner').value;
    const percent=parseNumber(document.getElementById('up-percent').value);
    if(!unitId||!partnerId||!percent) return;
    state.unitPartners.push({id:uid('UP'),unitId,partnerId,percent});
    persist(); nav('partners');
  };
  const prRows=state.partners.map(p=>[p.name,p.phone,`<button class="btn secondary" onclick="delRow('partners','${p.id}')">حذف</button>`]);
  document.getElementById('pr-list').innerHTML=table(['الاسم','الهاتف',''], prRows);
  const upRows=state.unitPartners.map(up=>[unitCode(up.unitId),(partnerById(up.partnerId)||{}).name||'—',up.percent+'%',`<button class="btn secondary" onclick="delRow('unitPartners','${up.id}')">حذف</button>`]);
  document.getElementById('up-list').innerHTML=table(['الوحدة','الشريك','النسبة',''], upRows);
}

/* ===== التقارير ===== */
function renderReports(){
  view.innerHTML=`
    <div class="card">
      <h3>تقارير</h3>
      <div class="grid grid-3">
        <button class="btn gold" onclick="runReport('units_status')">حالة الوحدات</button>
        <button class="btn gold" onclick="runReport('cust_activity')">نشاط العملاء</button>
        <button class="btn gold" onclick="runReport('inst_due')">أقساط مستحقة</button>
        <button class="btn gold" onclick="runReport('payments_monthly')">مدفوعات شهرية</button>
        <button class="btn gold" onclick="runReport('partner_profits')">أرباح الشركاء</button>
        <button class="btn gold" onclick="runReport('cashflow')">التدفقات النقدية</button>
      </div>
      <div class="tools">
        <input type="date" class="input" id="rep-from">
        <input type="date" class="input" id="rep-to">
        <small style="color:var(--muted)">اترك التواريخ فارغة لتقرير شامل.</small>
      </div>
      <hr>
      <div id="rep-out"></div>
    </div>`;
}
window.runReport=(type)=>{
  const from=document.getElementById('rep-from').value; const to=document.getElementById('rep-to').value;
  let title='', headers=[], rows=[];
  const out=document.getElementById('rep-out'); out.innerHTML='';
  switch(type){
    case 'units_status':
      title='تقرير حالة الوحدات'; headers=['الحالة','العدد','إجمالي السعر'];
      const stats={}; state.units.forEach(u=>{ stats[u.status]=(stats[u.status]||{c:0,p:0}); stats[u.status].c++; stats[u.status].p+=Number(u.totalPrice||0); });
      rows=Object.keys(stats).map(k=>[k,stats[k].c,egp(stats[k].p)]);
      break;
    case 'cust_activity':
      title='تقرير نشاط العملاء'; headers=['العميل','عدد الوحدات','إجمالي المدفوعات'];
      const custs={}; state.contracts.forEach(c=>{ custs[c.customerId]=(custs[c.customerId]||{u:new Set(),p:0}); custs[c.customerId].u.add(c.unitId); });

      let custPays=state.payments.slice();
      if(from) custPays=custPays.filter(p=>p.date>=from);
      if(to) custPays=custPays.filter(p=>p.date<=to);
      custPays.forEach(p=>{
        const ct=state.contracts.find(c=>c.unitId===p.unitId);
        if(ct&&ct.customerId&&custs[ct.customerId]) custs[ct.customerId].p+=Number(p.amount||0);
      });
      rows=Object.keys(custs).map(k=>[(custById(k)||{}).name||k,custs[k].u.size,egp(custs[k].p)]);
      break;
    case 'inst_due':
      title='تقرير الأقساط المستحقة'; headers=['الوحدة','العميل','المبلغ','تاريخ الاستحقاق'];
      let inst=state.installments.filter(i=>i.status!=='مدفوع');
      if(from) inst=inst.filter(i=>i.dueDate>=from); if(to) inst=inst.filter(i=>i.dueDate<=to);
      rows=inst.map(i=>[unitCode(i.unitId),(custById(state.contracts.find(c=>c.unitId===i.unitId)?.customerId)||{}).name,egp(i.amount),i.dueDate]);
      break;
    case 'payments_monthly':
      title='تقرير المدفوعات الشهرية'; headers=['الشهر','إجمالي المدفوعات'];
      let pays=state.payments.slice();
      if(from) pays=pays.filter(p=>p.date>=from); if(to) pays=pays.filter(p=>p.date<=to);
      const months={}; pays.forEach(p=>{ const ym=p.date.slice(0,7); months[ym]=(months[ym]||0)+Number(p.amount||0); });
      rows=Object.keys(months).sort().map(k=>[k,egp(months[k])]);
      break;
    case 'partner_profits':
      title='تقرير أرباح الشركاء'; headers=['الشريك','الوحدة','إجمالي الدفعة','نسبة الشريك','ربح الشريك'];
      let partnerPays=state.payments.slice();
      if(from) partnerPays=partnerPays.filter(p=>p.date>=from); if(to) partnerPays=partnerPays.filter(p=>p.date<=to);
      partnerPays.forEach(p=>{
        const links=state.unitPartners.filter(up=>up.unitId===p.unitId);
        links.forEach(l=>{
          const profit=Math.round((p.amount*l.percent/100)*100)/100;
          rows.push([(partnerById(l.partnerId)||{}).name||'—',unitCode(p.unitId),egp(p.amount),l.percent+'%',egp(profit)]);
        });
      });
      break;
    case 'cashflow':
      title='تقرير التدفقات النقدية'; headers=['التاريخ','البيان','مدين','دائن','الرصيد'];
      let trans=[];
      let payFlow=state.payments.slice();
      if(from) payFlow=payFlow.filter(p=>p.date>=from); if(to) payFlow=payFlow.filter(p=>p.date<=to);
      payFlow.forEach(p=>trans.push({d:p.date,n:`دفعة وحدة ${unitCode(p.unitId)}`,i:p.amount,o:0}));

      state.contracts.forEach(c=>{
        if(c.brokerAmount > 0) {
          const include = (!from || c.start >= from) && (!to || c.start <= to);
          if(include) {
            trans.push({d:c.start, n:`عمولة سمسار ${unitCode(c.unitId)}`, i:0, o:c.brokerAmount});
          }
        }
      });

      trans.sort((a,b)=>a.d.localeCompare(b.d));
      let bal=0;
      rows=trans.map(t=>{ bal+=Number(t.i||0)-Number(t.o||0); return [t.d,t.n,egp(t.i),egp(t.o),egp(bal)]; });
      break;
  }
  const bodyHTML=`<h1>${title}</h1>`+table(headers,rows);
  out.innerHTML=bodyHTML + `<div class="tools"><button class="btn" onclick="printReport('${title}',JSON.stringify({h:headers,r:rows}))">طباعة PDF</button></div>`;
};
window.printReport=(title,data)=>{
  const d=JSON.parse(data);
  const head=`<tr>${d.h.map(h=>`<th>${h}</th>`).join('')}</tr>`;
  const body=`<tbody>${d.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
  printHTML(title, `<h1>${title}</h1><table><thead>${head}</thead>${body}</table>`);
};

/* ===== نسخة احتياطية ===== */
function renderBackup(){
  view.innerHTML=`
    <div class="card">
      <h3>نسخة احتياطية</h3>
      <p>يتم حفظ بياناتك في متصفحك. قم بتنزيل نسخة احتياطية بشكل دوري.</p>
      <div class="tools">
        <button class="btn" onclick="doBackup()">تنزيل نسخة JSON</button>
        <label class="btn secondary">
          <input type="file" id="restore-file" accept=".json" style="display:none">
          استعادة نسخة
        </label>
        <button class="btn warn" onclick="doReset()">مسح كل البيانات</button>
      </div>
    </div>`;
  window.doBackup=()=>{
    const data=JSON.stringify(state);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`estate-backup-${today()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('restore-file').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    if(!confirm('سيتم استبدال كل البيانات الحالية. هل أنت متأكد؟')) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const restored=JSON.parse(String(r.result));
        Object.assign(state,restored);
        persist();
        alert('تمت الاستعادة بنجاح');
        nav('dash');
      }catch(err){ alert('ملف غير صالح'); }
    };
    r.readAsText(f);
  };
  window.doReset=()=>{
    if(prompt('اكتب "مسح" لتأكيد حذف كل البيانات')==='مسح'){
      localStorage.removeItem(APPKEY);
      location.reload();
    }
  };
}
</script>
